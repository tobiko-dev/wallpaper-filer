name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller pillow

      - name: Build app
        run: |
          chmod +x build.sh make_dmg.sh
          ./build.sh

      - name: Package DMG
        run: ./make_dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperFiler-dmg
          path: dist/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            Apple Silicon build. Unsigned, so on first launch macOS will
            block it — open System Settings → Privacy & Security, scroll
            down, and click "Open Anyway".
